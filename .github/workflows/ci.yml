name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - src/tf/**
      - .github/workflows/**

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ github.event_name != 'pull_request' || steps.changed-files.outputs.any_changed == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            src/tf/**
            .github/workflows/**

  validate:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version_file: src/tf/.tofu-version
      - name: Format check
        run: tofu fmt -check -recursive src/tf/
      - name: Validate modules
        run: |
          for dir in src/tf/modules/*/; do
            echo "Validating $dir"
            cd "$dir" && tofu init -backend=false && tofu validate && cd -
          done

  terraform-checks:
    name: Terraform checks
    if: always()
    needs: [changes, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe
        with:
          allowed-skips: validate
          jobs: ${{ toJSON(needs) }}
